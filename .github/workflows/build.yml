name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate Android project files
        run: flutter create --platforms=android --org com.ipeobom --project-name ipeobom .
      - run: rm -rf test
      - name: Use the fixed test signing key
        run: |
          mkdir -p ~/.android
          cp ci/debug.keystore ~/.android/debug.keystore
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter build apk --debug --dart-define=TRYON_API_KEY=${{ secrets.TRYON_API_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: ipeobom-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
      - name: Publish APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-debug.apk ipeobom-test.apk
          gh release create "test-${{ github.run_number }}" ipeobom-test.apk --title "테스트 빌드 ${{ github.run_number }}" --notes "자동 빌드된 테스트용 설치 파일입니다." --prerelease
